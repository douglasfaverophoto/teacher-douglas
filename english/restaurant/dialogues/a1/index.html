window.DIALOGUES = {
 id:"dialoguesA1", short:"Dialogues A1", lang:"en-US", level:"A1",
 kicker:"Casa Jacaranda · English A1",
 title:"Dia<span>logues</span>",
 sub:"Five short restaurant dialogues, from easy to a little harder. / Cinco diálogos cortos del restaurante, de fácil a un poco más difícil.",
 back:{href:"/english/restaurant/", label:"Teacher Douglas · Restaurant English"},
 voices:["daniel","alex","fred","david","mark","guy","aaron","arthur","tom","oliver","george","james","ryan","eric","andrew","brian","christopher","roger","male"],
 roles:{w:{name:"Waiter",es:"Mesero"}, g:{name:"Guest",es:"Cliente"}},
 items:[
 {t:"Welcome!", scene:"Dos clientes llegan al restaurante.",
  lines:[["w","Good evening! Welcome to Casa Jacaranda.","¡Buenas noches! Bienvenidos a Casa Jacaranda."],
         ["g","Good evening. A table for two, please.","Buenas noches. Una mesa para dos, por favor."],
         ["w","Of course. This way, please.","Claro. Por aquí, por favor."],
         ["g","Thank you!","¡Gracias!"]]},
 {t:"Your Table Is Ready", scene:"Una familia tiene una reservación.",
  lines:[["w","Good afternoon! Welcome to Casa Jacaranda.","¡Buenas tardes! Bienvenidos a Casa Jacaranda."],
         ["g","Hello. We have a reservation.","Hola. Tenemos una reservación."],
         ["w","What is the name, please?","¿A nombre de quién, por favor?"],
         ["g","García. A table for four.","García. Una mesa para cuatro."],
         ["w","Thank you, Mr. García. Your table is ready upstairs. This way, please.","Gracias, señor García. Su mesa está lista arriba. Por aquí, por favor."]]},
 {t:"Something to Drink?", scene:"El mesero ofrece bebidas a una pareja.",
  lines:[["w","Would you like something to drink?","¿Les gustaría algo de tomar?"],
         ["g","Yes, please. What do you have?","Sí, por favor. ¿Qué tienen?"],
         ["w","We have water, beer, wine and mezcal.","Tenemos agua, cerveza, vino y mezcal."],
         ["g","A glass of red wine, please.","Una copa de vino tinto, por favor."],
         ["w","Red wine. And for you, sir?","Vino tinto. ¿Y para usted, señor?"],
         ["g","Just water for me, please. No ice.","Solo agua para mí, por favor. Sin hielo."]]},
 {t:"What Is It?", scene:"Un cliente pregunta por un platillo del menú.",
  lines:[["w","Are you ready to order?","¿Están listos para ordenar?"],
         ["g","Yes. What is the \"pavo\"?","Sí. ¿Qué es el «pavo»?"],
         ["w","It is turkey with black mole, rice and plantain.","Es pavo con mole negro, arroz y plátano macho."],
         ["g","Is it spicy?","¿Pica?"],
         ["w","No, it is not spicy. It is a little sweet.","No, no pica. Es un poco dulce."],
         ["g","Great. The turkey, please.","Perfecto. El pavo, por favor."],
         ["w","Very good. One turkey with black mole.","Muy bien. Un pavo con mole negro."]]},
 {t:"The Check", scene:"Un cliente pide la cuenta y paga con tarjeta.",
  lines:[["g","Excuse me. The check, please.","Disculpe. La cuenta, por favor."],
         ["w","Of course. Here you are.","Claro. Aquí tiene."],
         ["g","How much is it?","¿Cuánto es?"],
         ["w","It is five hundred and thirty pesos.","Son quinientos treinta pesos."],
         ["g","Can I pay by card?","¿Puedo pagar con tarjeta?"],
         ["w","Yes, of course. Here is the card machine.","Sí, claro. Aquí está la terminal."],
         ["g","Thank you. The food is delicious!","Gracias. ¡La comida está deliciosa!"],
         ["w","Thank you very much. Have a nice evening!","Muchas gracias. ¡Que tenga buena noche!"]]}
 ]
};
