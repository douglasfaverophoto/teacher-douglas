 {t:"Do You Like It Strong?", scene:"El mesero empieza. El cliente no sabe mucho de mezcal.",
  lines:[["w","Good evening. Would you like to try one of our mezcals?","Buenas noches. ¿Le gustaría probar uno de nuestros mezcales?"],
         ["g","Yes, but I don't know much about mezcal.","Sí, pero no sé mucho de mezcal."],
         ["w","No problem. Do you like your drinks strong, or more smooth?","No hay problema. ¿Le gustan las bebidas fuertes, o más suaves?"],
         ["g","Smooth, please. Not too strong.","Suave, por favor. No muy fuerte."],

         ["w","Then I recommend our espadín. It's smooth, a little smoky and a bit sweet.","Entonces le recomiendo nuestro espadín. Es suave, un poco ahumado y algo dulce."],

 {t:"Smoky or Clean?", scene:"La clienta empieza. No quiere un mezcal muy ahumado.",
  lines:[["g","Excuse me. I'd like a mezcal, but not a very smoky one.","Disculpe. Quisiera un mezcal, pero no uno muy ahumado."],

         ["g","Yes, clean and fresh. Something fruity, maybe?","Sí, limpio y fresco. ¿Algo afrutado, tal vez?"],
         ["w","Try the tobalá. It's floral and fruity, with very little smoke.","Pruebe el tobalá. Es floral y afrutado, con muy poco humo."],
         ["g","Is it strong?","¿Es fuerte?"],
         ["w","It's 46% alcohol, but it feels soft.","Tiene 46% de alcohol, pero se siente suave."],
         ["g","Sounds good. One tobalá, please.","Suena bien. Un tobalá, por favor."]]},
 {t:"How Do I Drink It?", scene:"El mesero sirve el mezcal. El cliente nunca lo ha tomado.",
  lines:[["w","Here is your mezcal, with orange slices and worm salt.","Aquí está su mezcal, con rodajas de naranja y sal de gusano."],
         ["g","Worm salt? What is that?","¿Sal de gusano? ¿Qué es eso?"],
         ["w","It's salt with chile and toasted maguey worms. It's a tradition in Oaxaca.","Es sal con chile y gusanos de maguey tostados. Es una tradición en Oaxaca."],
         ["g","Interesting! Do I drink the mezcal in one shot?","¡Interesante! ¿Me tomo el mezcal de un trago?"],

         ["w","Take a sip, then bite the orange with a little salt.","Tome un traguito y luego muerda la naranja con un poco de sal."],
