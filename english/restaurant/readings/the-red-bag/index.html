 {t:"Table Five", s:"Upstairs · Arriba", time:"Martes · 14:00",

  help:[
   "Me llamo Ana. Soy mesera en Casa Jacaranda. El restaurante está en la calle Constitución, cerca de la iglesia de Santo Domingo.",

   "«Su mesa está lista arriba. Por aquí, por favor.» La mesa cinco está arriba, en la terraza. La mujer tiene el pelo corto y gris. Lleva un vestido amarillo. El hombre lleva una camisa azul.",
   "Comen y se van. Luego veo una bolsa debajo de la mesa cinco. Es una bolsa roja."],

  qs:[["What color is the man's jacket?<small>¿De qué color es la chamarra del hombre?</small>", ["Blue", "Black", "Brown"], 1],

   "Then the man in the black jacket comes. \"That is my bag!\" he says. He is very angry.",
   "I take my phone and I call the police. \"There is a tall man. He has brown hair. He wears a black jacket and white shoes. We are on Libres and Murguía. Please come!\""],
